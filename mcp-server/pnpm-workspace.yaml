# pnpm 10+ moved settings out of package.json's "pnpm" field to here.
# esbuild (pulled in by tsx/vitest) ships its binary via the @esbuild/<platform>
# optional dep, so its install script is a no-op we don't need — allow it anyway,
# and don't let pnpm's pre-run deps check turn the "ignored build" warning fatal.
onlyBuiltDependencies:
  - esbuild
verifyDepsBeforeRun: false
